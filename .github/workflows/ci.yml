name: CI

# Mirrors the local gates (justfile: lint / typecheck / test + frontend build). The one thing CI adds
# over a laptop run is a real Postgres+pgvector, so the DB-backed tests actually execute instead of
# self-skipping (see tests/conftest.py + DOMINION_REQUIRE_DB below).

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels the previous in-flight run for that branch — don't burn minutes on
# stale commits. Each main push still runs to completion (ref is unique per push group).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- static analysis: ruff + pyright (changed files). No DB, no network. Python 3.14. ----
  static:
    name: lint + types
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"   # pin every uv command (sync AND run) to one interpreter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: ruff check
        run: uv run --no-sync ruff check src tests
      - name: ruff format (check)
        run: uv run --no-sync ruff format --check src tests
      - name: pyright (changed files)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci_pyright_changed.sh

  # ---- tests: real Postgres+pgvector on Python 3.14. --------------------------------------------
  tests:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # pgvector preinstalled
        env:
          POSTGRES_USER: dominion
          POSTGRES_PASSWORD: dominion
          POSTGRES_DB: dominion
        ports:
          - 5432:5432
        # The job won't start steps until this reports healthy, so tests never race the DB coming up.
        options: >-
          --health-cmd "pg_isready -U dominion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      UV_PYTHON: "3.14"
      # conftest.py points the app at a dedicated test DB it creates/truncates itself.
      DOMINION_TEST_DATABASE_URL: postgresql+asyncpg://dominion:dominion@127.0.0.1:5432/dominion_test
      # Turn the "Postgres unreachable -> skip" fixture behaviour into a hard failure in CI, so a
      # broken DB service can never produce a falsely-green run.
      DOMINION_REQUIRE_DB: "1"
      # llm.py builds the Anthropic client lazily and tests mock complete(); a deliberately-fake key
      # means any accidental real call fails fast with an auth error instead of hanging.
      ANTHROPIC_API_KEY: sk-ant-ci-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: pytest
        # --no-sync runs in the env we just synced (no rebuild); -rs surfaces skips, which
        # DOMINION_REQUIRE_DB forbids.
        run: uv run --no-sync pytest -q -rs

  # ---- frontend: OpenAPI codegen drift + typecheck + lint + format + unit + e2e. One pnpm install. ----
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: .
      - run: uv run python scripts/export_openapi.py
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # keep in sync with Dockerfile (node:24-slim)
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
