name: CI

# Path-aware, layered CI. A `changes` gate (dorny/paths-filter) decides which jobs run so a
# frontend-only or docs-only PR doesn't pay for the full Postgres pytest + Playwright e2e.
#   - backend job (lint+types, tests)  -> runs on src/tests/pyproject/uv.lock/scripts changes
#   - frontend job (codegen/typecheck/lint/test) -> runs on frontend or API-contract changes
#   - Playwright e2e -> only on the "full" tier (main push, manual dispatch, `full-ci` label,
#     or shared-core changes), keeping branch PRs fast while main stays fully validated.
# The one thing CI adds over a laptop run is a real Postgres+pgvector, so DB-backed tests actually
# execute instead of self-skipping (see tests/conftest.py + DOMINION_REQUIRE_DB below).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch cancels the previous in-flight run for that branch — don't burn minutes on
# stale commits. Each main push still runs to completion (ref is unique per push group).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---- change detection: decides which downstream jobs run. -------------------------------------
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      api_contract: ${{ steps.decide.outputs.api_contract }}
      full: ${{ steps.decide.outputs.full }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            backend:
              - 'src/dominion/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/**'
            frontend:
              - 'frontend/**'
            api_contract:
              - 'openapi.json'
              - 'src/dominion/api/**'
              - 'src/dominion/shared/**'
              - 'frontend/src/desk/api/**'
            shared_core:
              - 'src/dominion/shared/**'
              - 'src/dominion/workers/pipeline.py'
              - 'src/dominion/workers/worker.py'
              - 'src/dominion/workers/router.py'
              - 'src/dominion/workers/context/**'
      - id: decide
        # Non-PR events (main push, manual dispatch) run everything ("full"). On a PR, run the full
        # tier when a shared contract/pipeline-core file changed or the `full-ci` label is present;
        # otherwise gate each job on its path filter.
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
             || [ "${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}" = "true" ] \
             || [ "${{ steps.filter.outputs.shared_core }}" = "true" ]; then
            { echo "full=true"; echo "backend=true"; echo "frontend=true"; echo "api_contract=true"; } >> "$GITHUB_OUTPUT"
          else
            {
              echo "full=false"
              echo "backend=${{ steps.filter.outputs.backend }}"
              echo "frontend=${{ steps.filter.outputs.frontend }}"
              echo "api_contract=${{ steps.filter.outputs.api_contract }}"
            } >> "$GITHUB_OUTPUT"
          fi

  # ---- static analysis: ruff + pyright (changed files). No DB, no network. Python 3.14. ----
  static:
    name: lint + types
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"   # pin every uv command (sync AND run) to one interpreter
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: ruff check
        run: uv run --no-sync ruff check src tests
      - name: ruff format (check)
        run: uv run --no-sync ruff format --check src tests
      - name: pyright (full src)
        # Full-tree type check over src/ (pyproject scopes pyright to ["src"]). Was changed-files-only,
        # which let a type regression in an untouched module ship unseen; src type-checks clean today.
        run: uv run --no-sync pyright

  # ---- tests: real Postgres+pgvector on Python 3.14. --------------------------------------------
  tests:
    name: tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # pgvector preinstalled
        env:
          POSTGRES_USER: dominion
          POSTGRES_PASSWORD: dominion
          POSTGRES_DB: dominion
        ports:
          - 5432:5432
        # The job won't start steps until this reports healthy, so tests never race the DB coming up.
        options: >-
          --health-cmd "pg_isready -U dominion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      UV_PYTHON: "3.14"
      # conftest.py points the app at a dedicated test DB it creates/truncates itself.
      DOMINION_TEST_DATABASE_URL: postgresql+asyncpg://dominion:dominion@127.0.0.1:5432/dominion_test
      # Turn the "Postgres unreachable -> skip" fixture behaviour into a hard failure in CI, so a
      # broken DB service can never produce a falsely-green run.
      DOMINION_REQUIRE_DB: "1"
      # llm.py builds the Anthropic client lazily and tests mock complete(); a deliberately-fake key
      # means any accidental real call fails fast with an auth error instead of hanging.
      ANTHROPIC_API_KEY: sk-ant-ci-not-a-real-key
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: pytest
        # --no-sync runs in the env we just synced (no rebuild); -rs surfaces skips, which
        # DOMINION_REQUIRE_DB forbids.
        run: uv run --no-sync pytest -q -rs

  # ---- frontend: OpenAPI codegen drift + typecheck + lint + format + unit. e2e is full-tier only. ----
  frontend:
    name: frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.api_contract == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: .
      - run: uv run python scripts/export_openapi.py
        working-directory: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"  # keep in sync with Dockerfile (node:24-slim)
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # ---- Playwright e2e is heavy (Chromium download + full run); only on the full-ci tier. ----
      - if: ${{ needs.changes.outputs.full == 'true' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - if: ${{ needs.changes.outputs.full == 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - if: ${{ needs.changes.outputs.full == 'true' }}
        run: pnpm e2e
        env:
          CI: "true"

  # ---- aggregator: a single stable required check for branch protection. Passes when no needed job
  # failed (skipped path-gated jobs are fine). Set this as the required status check, not the others.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, static, tests, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          for r in "${{ needs.static.result }}" "${{ needs.tests.result }}" "${{ needs.frontend.result }}"; do
            echo "job result: $r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job failed ($r)."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
