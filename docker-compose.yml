# Local Postgres with pgvector. `docker compose up -d`
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dominion
      POSTGRES_PASSWORD: dominion
      POSTGRES_DB: dominion
    ports:
      - "5432:5432"
    volumes:
      - dominion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dominion"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dominion_pgdata:
