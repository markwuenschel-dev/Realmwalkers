[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dominion"
version = "0.1.0"
description = "Dominion Realm — human-gated, scene-by-scene novel-writing system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "hypercorn>=0.17",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "pgvector>=0.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "anthropic>=0.40",
  "openai>=2.31",
  "structlog>=24.4",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.7", "pyright>=1.1"]

[project.scripts]
dominion-worker = "dominion.workers.worker:main"
dominion-seed = "dominion.workers.memory.seed:main"
dominion-audit = "dominion.tools.audit_job_ownership:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dominion"]

[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# -rs surfaces skip reasons on every invocation (CI already passes it; this makes a bare local
# `pytest` show the same, so a silently-skipped DB suite can't read as green). See conftest DB gate.
addopts = "-rs"

[tool.coverage.run]
# src layout: measure by installed package name, not a hardcoded "src/dominion" path. This is
# coverage.py's documented recommendation for src layouts — it resolves to wherever `dominion` is
# actually imported from (editable install, or pytest's `pythonpath` sys.path insertion below),
# instead of guessing a directory that may not match at measurement time.
source_pkgs = ["dominion"]

[tool.coverage.report]
show_missing = true
