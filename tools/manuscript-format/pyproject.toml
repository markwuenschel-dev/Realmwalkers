[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manuscript-format"
version = "1.3.1"
description = "Desktop manuscript formatter with multi-file merging, linked contents, and LitRPG interface styling"
requires-python = ">=3.12"
dependencies = ["python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
manuscript-format = "manuscript_format.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["manuscript_format"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
